; Pincer1 locator beacon. See README.md.
;
;   pio test -e native                  host unit tests (packet/AEAD, Find My, triggers)
;   pio run -e tbeam-supreme -t upload  beacon on a LilyGO T-Beam Supreme (ESP32-S3)
;   pio run -e tbeam-v12 -t upload      beacon on an older T-Beam v1.2 (ESP32)
;   pio run -e base-heltec -t upload    base station on a Heltec WiFi LoRa 32 V3
;
; Device id, LoRa key, Find My seed and region come from beacon.env (tools/provision.py) through
; tools/pio_keys.py; without the file the firmware builds unprovisioned and refuses to arm.

[platformio]
default_envs = tbeam-supreme
src_dir = src
test_dir = test

[common]
radiolib = jgromes/RadioLib@7.1.2
gps      = mikalhart/TinyGPSPlus@1.1.0
pmu      = lewisxhe/XPowersLib@0.2.7
imu      = lewisxhe/SensorLib@0.2.4
ble      = h2zero/NimBLE-Arduino@2.1.2
flags    = -Wall -Wextra -DBEACON_FW_VERSION=\"0.1.0\"

; ---------------------------------------------------------------- beacon, T-Beam Supreme (ESP32-S3)
[env:tbeam-supreme]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = huge_app.csv
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
monitor_speed = 115200
build_flags = ${common.flags}
    -DBOARD_TBEAM_SUPREME=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
lib_deps =
    ${common.radiolib}
    ${common.gps}
    ${common.pmu}
    ${common.imu}
    ${common.ble}
extra_scripts = pre:tools/pio_keys.py

; ---------------------------------------------------------------- beacon, T-Beam v1.2 (ESP32, AXP2101, no IMU)
[env:tbeam-v12]
platform = espressif32@6.9.0
board = ttgo-t-beam
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
build_flags = ${common.flags}
    -DBOARD_TBEAM_V12=1
lib_deps =
    ${common.radiolib}
    ${common.gps}
    ${common.pmu}
    ${common.ble}
extra_scripts = pre:tools/pio_keys.py

; ---------------------------------------------------------------- base station, Heltec WiFi LoRa 32 V3 (ESP32-S3, SX1262)
[env:base-heltec]
platform = espressif32@6.9.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_src_filter = +<aead.cpp> +<packet.cpp> +<sha256.cpp> +<base_main.cpp>
build_flags = ${common.flags}
    -DBOARD_HELTEC_V3=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Isrc
lib_deps =
    ${common.radiolib}
extra_scripts = pre:tools/pio_keys.py

; ---------------------------------------------------------------- host tests (Unity)
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<aead.cpp> +<packet.cpp> +<sha256.cpp> +<findmy.cpp> +<findmy_p224.cpp> +<triggers.cpp>
build_flags = ${common.flags} -std=c++17 -O1
    !python3 tools/host_mbedtls.py
