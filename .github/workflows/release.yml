name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  firmware:
    # unsigned images: the release key stays offline, provisioned boards get signed builds with the board
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - run: sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - run: cmake -S firmware -B firmware/build-target -DPICO_BOARD=pico2
      - run: cmake --build firmware/build-target --parallel
      # built twice; the release carries only bytes a second build reproduced
      - run: cmake -S firmware -B /tmp/pincer1-again -DPICO_BOARD=pico2 -DPICO_SDK_PATH=$PWD/firmware/build-target/_deps/pico_sdk-src
      - run: cmake --build /tmp/pincer1-again --parallel
      - run: cmp firmware/build-target/pincer1_consent.uf2 /tmp/pincer1-again/pincer1_consent.uf2
      - run: cmake -S firmware -B firmware/build-soft -DPICO_BOARD=pico2 -DPINCER_SOFT_SIGNER=ON -DPICO_SDK_PATH=$PWD/firmware/build-target/_deps/pico_sdk-src
      - run: cmake --build firmware/build-soft --parallel
      - run: |
          mkdir -p out
          cp firmware/build-target/pincer1_consent.uf2 out/pincer1-consent-${GITHUB_REF_NAME}-pico2.uf2
          cp firmware/build-soft/pincer1_consent.uf2 out/pincer1-consent-${GITHUB_REF_NAME}-pico2-softsigner.uf2
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: extension/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: |
          mkdir -p ../out
          (cd dist && zip -qr ../../out/pincer1-extension-${GITHUB_REF_NAME}.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: out/

  publish:
    needs: [firmware, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: |
          cd out
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "pincer1 $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
