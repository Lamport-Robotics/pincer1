stage: dpo
base_model: merged/lamport-8b-sft
output_dir: runs/dpo-h100
data_path: dpo/data/pairs.jsonl
hardware: h100_80gb
seq_len: 2048
micro_batch: 8
grad_accum: 2
lr: 5.0e-6
warmup_ratio: 0.1
weight_decay: 0.0
epochs: 1
dpo_beta: 0.1
dpo_loss: sigmoid
lora: {r: 64, alpha: 128, dropout: 0.05, targets: all-linear}
full_parameter: false
quant: null
packing: false
bf16: true
gradient_checkpointing: true
attn: flash_attention_2
think_tags: true
save_steps: 100
logging_steps: 5
eval_fraction: 0.05
seed: 7
